name: Quality checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.R"
      - "**/*.jl"
      - "**/*.ipynb"
      - "**/*.java"
      - "**/*.cpp"
      - "**/*.hpp"
      - "CSCI 161/**"
      - "C*/**"
      - "Machine Learning/**"
      - "InfoNetworks/**"
      - "MATH-Modeling/**"
      - "tools/**"
      - "requirements*.txt"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.R"
      - "**/*.jl"
      - "**/*.ipynb"
      - "**/*.java"
      - "**/*.cpp"
      - "**/*.hpp"
      - "CSCI 161/**"
      - "C*/**"
      - "Machine Learning/**"
      - "InfoNetworks/**"
      - "MATH-Modeling/**"
      - "tools/**"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check notebooks, links, secrets, and Python syntax
        run: python tools/check_repo.py --skip-code

      - name: Check MATH-Modeling notebooks, links, and data paths
        run: python "MATH-Modeling/scripts/check_repo.py"

  code:
    name: Java, C++, and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Java tests
        run: ./CSCI\ 161/test.sh

      - name: Run Python tests
        run: python -m pytest -q InfoNetworks/tests "Machine Learning/tests"

      - name: Build and run C++
        run: |
          make -C C++/hello-world
          ./C++/hello-world/build/hello-world
